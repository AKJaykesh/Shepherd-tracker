<style>
:root{
  --bg:#f3eee1; --surface:#fbf8ef; --surface2:#f0eadb; --ink:#1b2a1f; --muted:#68725f; --line:#ddd4bd;
  --accent:#2f5d3a; --accent-ink:#f6f2e6; --amber:#c17a22;
  --s-gray:#7b8376; --s-blue:#3b78b5; --s-amber:#bf7a1f; --s-purple:#7f5bbd; --s-green:#3a8a50; --s-red:#c0433a;
  --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -14px rgba(40,50,30,.35);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111912; --surface:#18221a; --surface2:#1f2b21; --ink:#ece6d4; --muted:#93a08d; --line:#2c3b2f;
    --accent:#86c993; --accent-ink:#0f1a11; --amber:#e3a651;
    --s-gray:#98a293; --s-blue:#6aa6e0; --s-amber:#e0a34d; --s-purple:#a58be0; --s-green:#6cc283; --s-red:#e8776d;
    --shadow:0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#111912; --surface:#18221a; --surface2:#1f2b21; --ink:#ece6d4; --muted:#93a08d; --line:#2c3b2f;
  --accent:#86c993; --accent-ink:#0f1a11; --amber:#e3a651;
  --s-gray:#98a293; --s-blue:#6aa6e0; --s-amber:#e0a34d; --s-purple:#a58be0; --s-green:#6cc283; --s-red:#e8776d;
  --shadow:0 8px 24px -14px rgba(0,0,0,.7);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono)}

.sync{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--s-green);display:inline-block}
.sync.busy i{background:var(--s-amber)} .sync.warn i{background:var(--s-red)}

/* layout */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);align-self:start;padding:22px 12px 40px 20px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:10px;color:var(--muted)}
.nav-item .num{font-family:var(--mono);font-size:11px;opacity:.7}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.7}
.nav-item:hover{background:var(--surface2);color:var(--ink)}
.nav-item.active{background:var(--accent);color:var(--accent-ink)}
.nav-item.active .num,.nav-item.active .count{opacity:.85}
main{padding:28px 28px 60px 16px;min-width:0}
@media (max-width:860px){

  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:15;flex-direction:row;overflow-x:auto;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);gap:6px}
  .nav-item{width:auto;white-space:nowrap;padding:7px 12px;border:1px solid var(--line)}

  main{padding:20px 16px 60px}
  .brand .tag{display:none}
  .search{width:120px}

.sec-head h2{font-size:34px;line-height:1.1;margin-top:4px}
.sec-head p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.sec-head .grow{flex:1;min-width:260px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--s-red);color:#fff}
.btn.sm{padding:5px 11px;font-size:12px}

/* pills / chips */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.gray{--c:var(--s-gray)}.blue{--c:var(--s-blue)}.amber{--c:var(--s-amber)}.purple{--c:var(--s-purple)}.green{--c:var(--s-green)}.red{--c:var(--s-red)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:8px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip b{color:var(--ink);font-weight:500;margin-right:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.filter.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card h3{font-size:18px;line-height:1.25}
.card .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.card .chips{display:flex;gap:6px;flex-wrap:wrap}
.notes{white-space:pre-wrap;color:var(--ink);opacity:.86;font-size:14px}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:10px;justify-content:space-between;align-items:center}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:10px;border:1px solid var(--line);padding:0;overflow:hidden;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card.quote{border-left:4px solid var(--amber)}
.card.quote .notes{font-family:var(--serif);font-size:16px;line-height:1.5}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:36px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}

.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 40px rgba(255,255,255,.04),0 0 0 90px rgba(255,255,255,.03)}
.hero .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.hero h1{font-size:clamp(40px,7vw,68px);line-height:1;margin:10px 0 12px}
.hero p{margin:0;max-width:52ch;font-size:17px;opacity:.92;position:relative;z-index:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:22px}

.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}

.statement small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}

.tiny{font-family:var(--mono);font-size:11px;color:var(--muted)}
textarea,input[type=text],input[type=url],input[type=date],select{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{resize:vertical;min-height:90px;line-height:1.55}
.pblock textarea{background:transparent;border:1px dashed transparent;padding:6px 8px;margin:0 -8px}

textarea:focus,input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px;border-color:transparent}
.src{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.src a{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.src .note{color:var(--muted);font-size:13px;flex:1}
.srcform{display:grid;grid-template-columns:1fr 1.3fr 1.3fr auto;gap:8px;margin-top:12px}
@media (max-width:700px){.srcform{grid-template-columns:1fr}}

/* kanban + timeline */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.col{background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.col h4{margin:2px 4px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.day{font-family:var(--mono);font-size:12px;color:var(--amber);margin:22px 0 10px;position:relative}
.day::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:3px solid var(--bg)}
.day:first-child{margin-top:0}
.timeline .card{margin-bottom:10px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(10,16,11,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(620px,100%);padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.modal h3{font-size:24px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.err{outline:2px solid var(--s-red)!important}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:70;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:var(--s-red);color:#fff}
.pager{display:flex;justify-content:space-between;margin-top:40px;gap:10px}
.hidden{display:none!important}

.sync.ro i{background:var(--muted)}

function fileToDataURL(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=rej;
    r.onload=function(){
      var img=new Image();img.onerror=rej;
      img.onload=function(){
        var s=Math.min(1,1920/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',.9));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
async function addImages(files){
  for(var i=0;i<files.length;i++){
    try{var u=await fileToDataURL(files[i]);if(M){M.images.push(u);drawModalImgs()}}
    catch(e){toast('Could not read that image.',true)}
  }
}

}

var SETUP_SQL="-- Shepherd tracker: database + security rules\n-- Paste this whole file into Supabase > SQL Editor > New query, then click Run.\n\n-- 1) Who is allowed to edit (and to see private entries)\ncreate table if not exists public.editors (\n  email text primary key\n);\n\n-- 2) All tracker entries (drone, maneuvers, PCB, deterrent, ML, tasks, feedback, log)\ncreate table if not exists public.entries (\n  id          uuid primary key default gen_random_uuid(),\n  type        text not null,\n  title       text not null,\n  status      text,\n  notes       text not null default '',\n  date        date,\n  f           jsonb not null default '{}'::jsonb,\n  tags        text[] not null default '{}',\n  images      text[] not null default '{}',\n  is_private  boolean not null default false,\n  created_at  timestamptz not null default now(),\n  updated_at  timestamptz not null default now()\n);\n\n-- 3) The business plan (a single row)\ncreate table if not exists public.plan (\n  id          int primary key default 1 check (id = 1),\n  content     jsonb not null default '{}'::jsonb,\n  updated_at  timestamptz not null default now()\n);\n\n-- 4) Helper: is the signed-in user an approved editor?\ncreate or replace function public.is_editor()\nreturns boolean\nlanguage sql\nstable\nsecurity definer\nset search_path = public\nas $$\n  select exists (\n    select 1 from public.editors\n    where lower(email) = lower(coalesce(auth.jwt() ->> 'email', ''))\n  );\n$$;\n\n-- 5) Lock everything down with Row Level Security\nalter table public.editors enable row level security;   -- no policies: nobody can read it through the API\nalter table public.entries enable row level security;\nalter table public.plan    enable row level security;\n\ndrop policy if exists \"read public entries, editors read all\" on public.entries;\ncreate policy \"read public entries, editors read all\" on public.entries\n  for select using (not is_private or public.is_editor());\n\ndrop policy if exists \"editors insert entries\" on public.entries;\ncreate policy \"editors insert entries\" on public.entries\n  for insert with check (public.is_editor());\n\ndrop policy if exists \"editors update entries\" on public.entries;\ncreate policy \"editors update entries\" on public.entries\n  for update using (public.is_editor()) with check (public.is_editor());\n\ndrop policy if exists \"editors delete entries\" on public.entries;\ncreate policy \"editors delete entries\" on public.entries\n  for delete using (public.is_editor());\n\ndrop policy if exists \"anyone reads plan\" on public.plan;\ncreate policy \"anyone reads plan\" on public.plan\n  for select using (true);\n\ndrop policy if exists \"editors insert plan\" on public.plan;\ncreate policy \"editors insert plan\" on public.plan\n  for insert with check (public.is_editor());\n\ndrop policy if exists \"editors update plan\" on public.plan;\ncreate policy \"editors update plan\" on public.plan\n  for update using (public.is_editor()) with check (public.is_editor());\n";
function isMissingTable(e){return !!e&&(e.code==='PGRST205'||e.code==='42P01'||/could not find the table|does not exist/i.test(e.message||''))}
function validEmail(v){return /^\S+@\S+\.\S+$/.test(v||'')}
function buildSql(email){
  var em=validEmail(email)?email.replace(/'/g,"''"):'you@example.com';
  return SETUP_SQL+"\n-- Approve yourself as an editor\ninsert into public.editors (email) values ('"+em+"') on conflict do nothing;\n";
}
function setupCard(){
  var ref=(String(CFG.SUPABASE_URL).match(/^https:\/\/([a-z0-9]+)\.supabase\.co/i)||[])[1]||'';
  var link=ref?'https://supabase.com/dashboard/project/'+ref+'/sql/new':'https://supabase.com/dashboard';
  return '<div class="panel" style="margin-bottom:22px"><h3>One-time database setup</h3>'+
    '<p style="margin:0 0 12px;color:var(--muted)">The site is connected, but your database has no tables yet. This takes about a minute:</p>'+
    '<ol style="margin:0 0 14px;padding-left:20px;line-height:1.8">'+
    '<li>Type the email you will sign in with: <input id="setupEmail" type="email" placeholder="you@example.com" style="width:min(320px,100%);font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></li>'+
    '<li><button class="btn sm" data-act="copy-sql">Copy setup SQL</button></li>'+
    '<li>Open the <a href="'+link+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:600">Supabase SQL Editor</a>, paste, and click <b>Run</b>.</li>'+
    '<li><button class="btn sm ghost" data-act="recheck">I ran it, check again</button></li></ol>'+
    '<textarea id="setupSql" readonly rows="8" style="font-family:var(--mono);font-size:12px;min-height:0">'+esc(buildSql(''))+'</textarea></div>';
}
function copySql(){
  var em=($('#setupEmail')||{}).value||'';
  if(!validEmail(em)){toast('Type your email first.',true);var i=$('#setupEmail');if(i)i.focus();return}
  var ta=$('#setupSql');ta.value=buildSql(em);ta.select();
  function fb(){var ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'SQL copied. Paste it into the SQL Editor.':'Select the text and press Ctrl+C.',!ok)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){toast('SQL copied. Paste it into the SQL Editor.')},fb)}else fb();
}
function notice(){
  if(!configured())return '<div class="empty" style="margin-bottom:22px;text-align:left"><h3>Almost there — connect your database</h3>Open <b>index.html</b> and fill in <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> at the top. The README walks through it.</div>';
  if(S.needsSetup)return setupCard();
  if(!S.loaded)return '<div class="tiny" style="margin-bottom:12px">Loading…</div>';
  return '';
}

/* ---------- sign in ---------- */
function openAuth(){
  $('#layer').innerHTML='<div class="modal-bg" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true"><h3>Editor sign in</h3>'+
    '<p class="tiny" style="margin:0 0 14px;font-family:var(--sans);font-size:14px">Only approved editors can change this site. Enter your email and we will send you a one-time sign-in link.</p>'+
    '<div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" style="width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px"></div>'+
    '<div class="tiny" id="authMsg" style="min-height:1.5em"></div>'+
    '<div class="actions"><button class="btn ghost" data-act="modal-close">Close</button><button class="btn" data-act="auth-send">Send sign-in link</button></div></div></div>';
  var i=$('#authEmail');if(i)i.focus();
}
async function sendLink(){
  var em=($('#authEmail').value||'').trim(),msg=$('#authMsg');
  if(!/^\S+@\S+\.\S+$/.test(em)){msg.textContent='Enter a valid email address.';return}
  msg.textContent='Sending…';
  var r=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
  msg.textContent=r.error?'Could not send a link: '+(r.error.message||'unknown error'):'Check your email for the sign-in link, then come back here.';
}

/* ---------- events ---------- */
function go(id){S.section=id;S.q='';var s=$('#search');if(s)s.value='';stash();renderAll();window.scrollTo(0,0)}
document.addEventListener('click',function(ev){
  var g=ev.target.closest('[data-go]');
  var a=ev.target.closest('[data-act]');
  if(a&&(a.dataset.act!=='modal-bg'||ev.target===a)){
    var act=a.dataset.act,d=a.dataset;
    switch(act){
      case 'add':if(editable())openModal(d.type);return;
      case 'edit':if(editable())openModal(S.entries.find(function(e){return e.id===d.id}).type,d.id);return;
      case 'filter':S.filter[d.type]=d.v;renderMain();return;
      case 'advance':{
        var t=S.entries.find(function(x){return x.id===d.id});if(!t||!editable())return;
        var L=TYPES.tasks.statuses,k=L.findIndex(function(s){return s[0]===t.status});
        t.status=L[(k+1)%L.length][0];t.updated=new Date().toISOString();renderAll();
        saveEntry(t).then(function(ok){if(!ok)loadData().then(renderAll)});return}
      case 'modal-close':case 'modal-bg':closeModal();return;
      case 'modal-save':saveModal();return;
      case 'modal-delete':{
        if(!M)return;var b=$('#delBtn');
        if(!M.confirm){M.confirm=true;b.textContent='Really delete?';b.classList.remove('ghost');b.classList.add('danger');return}
        var did=M.id;closeModal();S.entries=S.entries.filter(function(e){return e.id!==did});renderAll();
        run(function(){return sb.from('entries').delete().eq('id',did)}).then(function(ok){if(!ok)loadData().then(renderAll)});return}
      case 'rm-img':M.images.splice(+d.i,1);drawModalImgs();return;
      case 'lightbox':{
        var src=d.modal?(M&&M.images[+d.i]):(function(){var e=S.entries.find(function(x){return x.id===d.eid});return e&&e.images&&e.images[+d.i]})();
        if(!src||!IMG_RE.test(src))return;
        var lb=document.createElement('div');lb.className='lightbox';lb.dataset.act='lb-close';lb.innerHTML='<img alt="" src="'+src+'">';document.body.appendChild(lb);return}
      case 'lb-close':a.remove();return;
      case 'theme':{var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';return}
      case 'auth':if(!sb)return;if(S.session){sb.auth.signOut()}else openAuth();return;
      case 'auth-send':if(sb)sendLink();return;
      case 'copy-sql':copySql();return;
      case 'recheck':refresh();return;
      case 'src-add':addSource();return;
      case 'src-del':removeSource(+d.i);return;
    }
  }
  if(g){go(g.dataset.go)}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='search'){S.q=t.value.trim();renderMain();return}
  if(t.id==='setupEmail'){var ta=$('#setupSql');if(ta)ta.value=buildSql(t.value.trim());return}
  if(t.dataset&&t.dataset.plan&&editable()){
    var k=t.dataset.plan;fit(t);
    S.plan=Object.assign({},S.plan||{});S.plan[k]=t.value;
    var sv=$('#sv_'+k);if(sv)sv.textContent='typing…';
    savePlanSoon(900);
  }
  if(t.classList&&t.classList.contains('err'))t.classList.remove('err');
});
document.addEventListener('change',function(ev){var t=ev.target;if(t.id==='f_file'){addImages(Array.from(t.files));t.value=''}});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){var lb=document.querySelector('.lightbox');if(lb)lb.remove();else if(M)closeModal();return}
  if(ev.key==='Enter'&&ev.target.id==='authEmail'){sendLink();return}
  var tag=(ev.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||M)return;
  var i=SECTIONS.findIndex(function(s){return s.id===S.section});
  if(ev.key==='ArrowRight'&&SECTIONS[i+1])go(SECTIONS[i+1].id);
  if(ev.key==='ArrowLeft'&&SECTIONS[i-1])go(SECTIONS[i-1].id);
});
function addSource(){
  var title=$('#srcTitle').value.trim(),url=$('#srcUrl').value.trim(),note=$('#srcNote').value.trim();
  if(!/^https?:\/\//i.test(url)){$('#srcUrl').classList.add('err');toast('Add a link starting with https://',true);return}
  if(!title){try{title=new URL(url).hostname}catch(e){title=url}}
  var L=((S.plan&&S.plan.sources)||[]).slice();L.push({title:title,url:url,note:note});
  S.plan=Object.assign({},S.plan||{},{sources:L});renderMain();savePlanSoon(200);
}
function removeSource(i){
  var L=((S.plan&&S.plan.sources)||[]).slice();L.splice(i,1);
  S.plan=Object.assign({},S.plan||{},{sources:L});renderMain();savePlanSoon(200);
}

/* ---------- boot ---------- */
(function boot(){
  try{var s=sessionStorage.getItem('shepherd.section');if(s&&secOf(s))S.section=s}catch(e){}
  mount();renderAll();
  if(!configured())return;
  if(!window.supabase||!window.supabase.createClient){toast('Could not load the database library. Check your connection.',true);return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(function(evt){
    if(evt==='INITIAL_SESSION'||evt==='SIGNED_IN'||evt==='SIGNED_OUT'||evt==='USER_UPDATED')setTimeout(refresh,0);
  });
})();
})();

</script>
